<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Nova solicitação | AjudaAgora</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    </head>

    <body>
        <header>
            <div class="container header-content">
                <a href="{{ url_for('index') }}" class="logo"> AjudaAgora </a>

                <nav>
                    <a href="{{ url_for('index') }}"> Início </a>

                    <a href="{{ url_for('usuario') }}"> Usuários </a>
                </nav>
            </div>
        </header>

        <main class="container">
            <section class="pagina-topo">
                <span class="subtitulo"> AJUDA • CONEXÃO </span>

                <h2>Nova solicitação</h2>

                <p>Cadastre uma solicitação de ajuda.</p>
            </section>

            <section class="form-card">
                <form method="POST">
                    <div class="form-grid">
                        <!-- USUÁRIO -->

                        <div>
                            <label for="id_usuario"> Usuário </label>

                            <select name="id_usuario" id="id_usuario" required>
                                <option value="">Selecione o usuário</option>

                                {% for usuario in usuarios %}

                                <option value="{{ usuario.id_usuario }}">{{ usuario.nome }}</option>

                                {% endfor %}
                            </select>
                        </div>

                        <!-- CATEGORIA -->

                        <div>
                            <label for="id_categoria"> Categoria </label>

                            <select name="id_categoria" id="id_categoria" required>
                                <option value="">Selecione a categoria</option>

                                {% for categoria in categorias %}

                                <option value="{{ categoria.id_categoria }}">{{ categoria.nome_categoria }}</option>

                                {% endfor %}
                            </select>
                        </div>

                        <!-- VOLUNTÁRIO -->

                        <div>
                            <label for="id_voluntario"> Voluntário </label>

                            <select name="id_voluntario" id="id_voluntario">
                                <option value="">Ainda não definido</option>

                                {% for voluntario in voluntarios %}

                                <option value="{{ voluntario.id_usuario }}">{{ voluntario.nome }}</option>

                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="campo-grande">
                        <label for="descricao"> Descrição </label>

                        <textarea name="descricao" id="descricao" placeholder="Explique o que você precisa..." required></textarea>
                    </div>

                    <div class="campo-grande">
                        <label for="localizacao"> Localização </label>

                        <input type="text" name="localizacao" id="localizacao" placeholder="Onde a ajuda é necessária?" />
                    </div>

                    <label class="checkbox">
                        <input type="checkbox" name="urgente" />

                        <span> Esta solicitação é urgente </span>
                    </label>

                    <div class="form-acoes">
                        <a href="{{ url_for('index') }}" class="botao-secundario"> Cancelar </a>

                        <button type="submit">Salvar solicitação</button>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <div class="container">
                <p>AjudaAgora © 2026</p>
            </div>
        </footer>
    </body>
</html>
