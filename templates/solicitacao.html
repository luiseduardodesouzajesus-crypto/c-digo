<!doctype html>

<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <title>Nova solicitação</title>

        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    </head>

    <body>
        <header>
            <h1>Dispositivos Móveis</h1>

            <nav>
                <a href="/"> Início </a>
            </nav>
        </header>

        <main>
            <section class="formulario">
                <h2>Nova solicitação</h2>

                <p>Cadastro baseado na entidade Solicitação do modelo conceitual.</p>

                <form method="POST">
                    <label> Usuário </label>

                    <select name="id_usuario" required>
                        <option value="">Selecione um usuário</option>

                        {% for usuario in usuarios %}

                        <option value="{{ usuario.id_usuario }}">{{ usuario.nome }}</option>

                        {% endfor %}
                    </select>

                    <label> Categoria </label>

                    <select name="id_categoria" required>
                        <option value="">Selecione uma categoria</option>

                        {% for categoria in categorias %}

                        <option value="{{ categoria.id_categoria }}">{{ categoria.nome_categoria }}</option>

                        {% endfor %}
                    </select>

                    <label> Descrição </label>

                    <textarea name="descricao" rows="5" required></textarea>

                    <label> Localização </label>

                    <input type="text" name="localizacao" />

                    <label class="checkbox">
                        <input type="checkbox" name="urgente" />

                        Solicitação urgente
                    </label>

                    <button type="submit">Salvar solicitação</button>
                </form>
            </section>
        </main>
    </body>
</html>
