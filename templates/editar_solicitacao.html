<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <title>Editar solicitação</title>
    <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body>
    <h1>Editar solicitação</h1>

    <form method="POST">
        <label>Usuário:</label>

        <select name="id_usuario">
            {% for usuario in usuarios %}

            <option value="{{ usuario.id_usuario }}">{{ usuario.nome }}</option>

            {% endfor %}
        </select>

        <br /><br />

        <label>Categoria:</label>

        <select name="id_categoria">
            {% for categoria in categorias %}

            <option value="{{ categoria.id_categoria }}">{{ categoria.nome_categoria }}</option>

            {% endfor %}
        </select>

        <br /><br />

        <label>Descrição:</label>

        <textarea name="descricao" required>{{ solicitacao.descricao }}</textarea>

        <br /><br />

        <label>Localização:</label>

        <input name="localizacao" value="{{ solicitacao.localizacao }}" />

        <br /><br />

        <label>Status:</label>

        <select name="status">
            <option value="aberta">Aberta</option>
            <option value="em andamento">Em andamento</option>
            <option value="concluida">Concluída</option>
        </select>

        <br /><br />

        <label>
            <input type="checkbox" name="urgente" />

            Urgente
        </label>

        <br /><br />

        <button>Salvar alterações</button>
    </form>

    <br />

    <a href="/">Voltar</a>
</body>

</html>
